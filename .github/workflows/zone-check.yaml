name: Zone CRM check

on:
  push:
    branches: [zone]
    paths:
      - 'packages/twenty-server/**'
      - 'packages/twenty-front/**'
      - 'packages/twenty-shared/**'
      - 'packages/twenty-ui/**'
      - '.github/workflows/zone-check.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Build twenty-shared
        run: npx nx build twenty-shared
      - name: Server typecheck
        run: npx nx run twenty-server:typecheck
      - name: Server lint
        run: npx nx run twenty-server:lint
      # Decision 12 asked for a test of each refusal. A test that is only
      # typechecked is not a test, and typecheck and lint were all this job ran,
      # so the fork's own unit tests are named here and actually run.
      #
      # jest directly rather than through nx: "nx run twenty-server:test --"
      # does not scope anything, it runs all 1139 suites, of which two fail in
      # this fork for reasons that predate it (standard-metadata-label-catalog
      # and get-auth-providers-by-workspace). Those are upstream's to answer
      # for and are not what this gate is about.
      - name: Zone CRM server tests
        working-directory: packages/twenty-server
        run: npx jest --config ./jest.config.mjs --ci --runInBand --testPathPattern=imap-smtp-caldav

  front:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Build libraries
        run: |
          npx nx build twenty-shared
          npx nx build twenty-ui
          npx nx build twenty-front-component-renderer
      - name: Front typecheck
        run: npx nx run twenty-front:typecheck
      - name: Front lint
        run: npx nx run twenty-front:lint
